services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: carebridge
      POSTGRES_PASSWORD: carebridge_local_only
      POSTGRES_DB: carebridge
    ports:
      - "5432:5432"
    volumes:
      - carebridge_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carebridge -d carebridge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  carebridge_postgres:
